name: Isolated Provider Verification

on:
  # Deliberately manual-only: this workflow performs real provider calls.
  # A push to main must never become an implicit model invocation.
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to probe independently
        required: true
        type: choice
        options:
          - primary
          - secondary
          - logic
          - all

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.provider }} provider
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Serialize probes per brain, including overlap between "all" and a
      # single-provider dispatch. Never cancel an in-flight evidence run.
      group: ryanai-provider-verification-${{ matrix.provider }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ inputs.provider == 'all' && fromJSON('["primary","secondary","logic"]') || fromJSON(format('["{0}"]', inputs.provider)) }}
    environment: ryanai-provider-verification
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ryanai_probe
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: ryanai_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ryanai_probe -d ryanai_probe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ryanai_probe:disposable_ci_password@127.0.0.1:5432/ryanai_probe
      RYANAI_PROBE_BRAIN: ${{ matrix.provider }}
      # Match the runtime resolver's canonical credential names. Each matrix
      # job receives only credentials for its selected brain; no generic alias
      # is injected because the runtime never reads PROVIDER_API_KEY.
      NVIDIA_API_KEY: ${{ matrix.provider == 'primary' && secrets.NVIDIA_API_KEY || '' }}
      QWEN_API_KEY: ${{ matrix.provider == 'secondary' && secrets.QWEN_API_KEY || '' }}
      TOGETHER_API_KEY: ${{ matrix.provider == 'secondary' && secrets.TOGETHER_API_KEY || '' }}
      OPENROUTER_API_KEY: ${{ matrix.provider == 'secondary' && secrets.OPENROUTER_API_KEY || '' }}
      DASHSCOPE_API_KEY: ${{ matrix.provider == 'secondary' && secrets.DASHSCOPE_API_KEY || '' }}
      SILICONFLOW_API_KEY: ${{ matrix.provider == 'secondary' && secrets.SILICONFLOW_API_KEY || '' }}
      LOGIC_API_KEY: ${{ matrix.provider == 'logic' && secrets.LOGIC_API_KEY || '' }}
      OPENAI_API_KEY: ${{ matrix.provider == 'logic' && secrets.OPENAI_API_KEY || '' }}
      GROK_API_KEY: ${{ matrix.provider == 'logic' && secrets.GROK_API_KEY || '' }}
      # Match the production resolver exactly. Do not use a generic
      # PROVIDER_API_KEY: resolveProviderProbeConfig never reads that name.
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      LOGIC_API_KEY: ${{ secrets.LOGIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NVIDIA_API_ENDPOINT: ${{ vars.NVIDIA_API_ENDPOINT }}
      QWEN_API_ENDPOINT: ${{ vars.QWEN_API_ENDPOINT }}
      TOGETHER_API_ENDPOINT: ${{ vars.TOGETHER_API_ENDPOINT }}
      PRIMARY_REASONING_PROVIDER: ${{ vars.PRIMARY_REASONING_PROVIDER }}
      SECONDARY_REASONING_PROVIDER: ${{ vars.SECONDARY_REASONING_PROVIDER }}
      LOGIC_REASONING_PROVIDER: ${{ vars.LOGIC_REASONING_PROVIDER }}
      NVIDIA_PROVIDER: ${{ vars.NVIDIA_PROVIDER }}
      QWEN_PROVIDER: ${{ vars.QWEN_PROVIDER }}
      LOGIC_PROVIDER: ${{ vars.LOGIC_PROVIDER }}
      GROK_API_ENDPOINT: ${{ vars.GROK_API_ENDPOINT }}
      GROK_MODEL: ${{ vars.GROK_MODEL }}
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
      OLLAMA_URL: ${{ vars.OLLAMA_URL }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
      LOGIC_API_ENDPOINT: ${{ vars.LOGIC_API_ENDPOINT }}
      PRIMARY_REASONING_MODEL: ${{ vars.PRIMARY_REASONING_MODEL }}
      SECONDARY_REASONING_MODEL: ${{ vars.SECONDARY_REASONING_MODEL }}
      LOGIC_REASONING_MODEL: ${{ vars.LOGIC_REASONING_MODEL }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma client and prepare disposable health database
        run: |
          npm run db:generate
          npx prisma db push --accept-data-loss
      - name: Execute one authenticated provider challenge and persist health record
        run: node --import tsx scripts/provider-live-probe.mjs
