name: Aerial AI-RAN contract

on:
  pull_request:
    paths:
      - 'src/server/aerial/**'
      - 'aerial-bridge/**'
      - 'scripts/aerial-ai-ran-smoke.mjs'
      - 'src/server/launcher.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/aerial-ai-ran.yml'
  push:
    branches:
      - main
    paths:
      - 'src/server/aerial/**'
      - 'aerial-bridge/**'
      - 'scripts/aerial-ai-ran-smoke.mjs'
      - 'src/server/launcher.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/aerial-ai-ran.yml'

permissions:
  contents: read

jobs:
  aerial-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --include=dev --legacy-peer-deps
      - run: npm run aerial:smoke
      - run: npm run build:server
