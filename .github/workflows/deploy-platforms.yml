name: Deploy Platforms via CI

on:
  # Production deployment is deliberately manual; workflow_run must never
  # start production jobs automatically after a main-branch CI completion.
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact reviewed commit SHA to deploy"
        required: true
        type: string
      confirmation:
        description: "Type PUSH_DEPLOY only to authorize the exact-main deployment to Railway, Render, and Vercel after every required CI/security check passes."
        required: true
        type: choice
        options:
          - NO
          - PUSH_DEPLOY
        default: NO

permissions:
  contents: read
  actions: read

concurrency:
  group: platform-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify exact-head CI and security gate
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'PUSH_DEPLOY'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve exact deployment SHA
        id: sha
        env:
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          sha="$INPUT_SHA"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid deployment SHA"; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Confirm exact commit is main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "$SHA" == "$main_sha" ]] || {
            echo "::error::Deployment SHA is not the current main SHA; refusing deployment."
            exit 1
          }

      - name: Require CI workflow success for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          runs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" --jq '.workflow_runs[] | select(.name=="CI - Build, Test, and Integrate") | [.status,.conclusion,.id] | @tsv')"
          echo "$runs"
          echo "$runs" | grep -q $'completed\tsuccess\t' || {
            echo "::error::No successful CI workflow run exists for the exact deployment SHA."
            exit 1
          }

      - name: Require every exact-head CI and security check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          required=(
            "Validate (typecheck, lint, test, build)"
            "MCP server and workflow worker"
            "Issue 435 migrations and attachment security"
            "Test agent API contracts"
            "Dependency audit"
            "Trivy filesystem scan"
            "Analyze (javascript-typescript)"
            "Analyze (python)"
            "TruffleHog secret audit"
            "Codacy Security Scan"
          )
          gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" > check-pages.json
          jq -s '[.[].check_runs[]]' check-pages.json > checks.json
          for name in "${required[@]}"; do
            jq -e --arg name "$name" '
              [.[] | select(.name == $name)] as $matches
              | ($matches | length) > 0
                and all($matches[]; .status == "completed" and .conclusion == "success")
            ' checks.json >/dev/null || {
              echo "::error::Required exact-head check is missing, queued, skipped, cancelled, or failed: $name"
              exit 1
            }
          done
  railway:
    name: Railway deploy
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy exact SHA to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "${RAILWAY_TOKEN:-}" ]] || { echo "::error::RAILWAY_TOKEN is not configured"; exit 1; }
          [[ -n "${RAILWAY_PROJECT_ID:-}" ]] || { echo "::error::RAILWAY_PROJECT_ID is not configured"; exit 1; }
          [[ -n "${RAILWAY_ENVIRONMENT_ID:-}" ]] || { echo "::error::RAILWAY_ENVIRONMENT_ID is not configured"; exit 1; }
          [[ -n "${RAILWAY_SERVICE_ID:-}" ]] || { echo "::error::RAILWAY_SERVICE_ID is not configured"; exit 1; }
          railway up --ci --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --project "$RAILWAY_PROJECT_ID"

  render:
    name: Render deploy
    needs: [gate, railway]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy for exact SHA
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_IDS: ${{ vars.RENDER_SERVICE_IDS }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "${RENDER_API_KEY:-}" ]] || { echo "::error::RENDER_API_KEY is not configured"; exit 1; }
          [[ -n "${RENDER_SERVICE_IDS:-}" ]] || { echo "::error::RENDER_SERVICE_IDS is not configured"; exit 1; }

          IFS=',' read -ra services <<< "$RENDER_SERVICE_IDS"
          for service_id in "${services[@]}"; do
            service_id="$(echo "$service_id" | xargs)"
            [[ -n "$service_id" ]] || continue
            echo "Triggering Render service $service_id at $DEPLOY_SHA"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.render.com/v1/services/${service_id}/deploys" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "$(jq -n --arg commitId "$DEPLOY_SHA" --arg deployMode "build_and_deploy" '{commitId:$commitId,deployMode:$deployMode}')" 
          done

  vercel:
    name: Vercel deploy
    needs: [gate, railway]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Validate Vercel project configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
        run: |
          set -euo pipefail
          [[ -n "${VERCEL_TOKEN:-}" ]] || { echo "::error::VERCEL_TOKEN is not configured"; exit 1; }
          [[ -n "${VERCEL_ORG_ID:-}" ]] || { echo "::error::VERCEL_ORG_ID is not configured"; exit 1; }
          [[ -n "${VERCEL_PROJECT_ID:-}" ]] || { echo "::error::VERCEL_PROJECT_ID is not configured"; exit 1; }
          [[ -n "${VERCEL_CLI_VERSION:-}" ]] || { echo "::error::VERCEL_CLI_VERSION is not configured"; exit 1; }
          npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Link the explicitly configured Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

      - name: Pull Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build exact reviewed commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact without changing domain aliases
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --skip-domain --token "$VERCEL_TOKEN"
completed\tsuccess\t' || {
            echo "::error::No successful CI workflow run exists for the exact deployment SHA."
            exit 1
          }

      - name: Require every exact-head CI and security check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          required=(
            "Validate (typecheck, lint, test, build)"
            "MCP server and workflow worker"
            "Issue 435 migrations and attachment security"
            "Test agent API contracts"
            "Dependency audit"
            "Trivy filesystem scan"
            "Analyze (javascript-typescript)"
            "Analyze (python)"
            "TruffleHog secret audit"
            "Codacy Security Scan"
          )
          gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" > check-pages.json
          jq -s '[.[].check_runs[]]' check-pages.json > checks.json
          for name in "${required[@]}"; do
            jq -e --arg name "$name" '
              [.[] | select(.name == $name)] as $matches
              | ($matches | length) > 0
                and all($matches[]; .status == "completed" and .conclusion == "success")
            ' checks.json >/dev/null || {
              echo "::error::Required exact-head check is missing, queued, skipped, cancelled, or failed: $name"
              exit 1
            }
          done

  railway:
    name: Railway deploy
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy exact SHA to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "${RAILWAY_TOKEN:-}" ]] || { echo "::error::RAILWAY_TOKEN is not configured"; exit 1; }
          [[ -n "${RAILWAY_PROJECT_ID:-}" ]] || { echo "::error::RAILWAY_PROJECT_ID is not configured"; exit 1; }
          [[ -n "${RAILWAY_ENVIRONMENT_ID:-}" ]] || { echo "::error::RAILWAY_ENVIRONMENT_ID is not configured"; exit 1; }
          [[ -n "${RAILWAY_SERVICE_ID:-}" ]] || { echo "::error::RAILWAY_SERVICE_ID is not configured"; exit 1; }
          railway up --ci --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --project "$RAILWAY_PROJECT_ID"

  render:
    name: Render deploy
    needs: [gate, railway]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy for exact SHA
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_IDS: ${{ vars.RENDER_SERVICE_IDS }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "${RENDER_API_KEY:-}" ]] || { echo "::error::RENDER_API_KEY is not configured"; exit 1; }
          [[ -n "${RENDER_SERVICE_IDS:-}" ]] || { echo "::error::RENDER_SERVICE_IDS is not configured"; exit 1; }

          IFS=',' read -ra services <<< "$RENDER_SERVICE_IDS"
          for service_id in "${services[@]}"; do
            service_id="$(echo "$service_id" | xargs)"
            [[ -n "$service_id" ]] || continue
            echo "Triggering Render service $service_id at $DEPLOY_SHA"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.render.com/v1/services/${service_id}/deploys" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "$(jq -n --arg commitId "$DEPLOY_SHA" --arg deployMode "build_and_deploy" '{commitId:$commitId,deployMode:$deployMode}')" 
          done

  vercel:
    name: Vercel deploy
    needs: [gate, railway]
    if: inputs.vercel_confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Validate Vercel project configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
        run: |
          set -euo pipefail
          [[ -n "${VERCEL_TOKEN:-}" ]] || { echo "::error::VERCEL_TOKEN is not configured"; exit 1; }
          [[ -n "${VERCEL_ORG_ID:-}" ]] || { echo "::error::VERCEL_ORG_ID is not configured"; exit 1; }
          [[ -n "${VERCEL_PROJECT_ID:-}" ]] || { echo "::error::VERCEL_PROJECT_ID is not configured"; exit 1; }
          [[ -n "${VERCEL_CLI_VERSION:-}" ]] || { echo "::error::VERCEL_CLI_VERSION is not configured"; exit 1; }
          npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Link the explicitly configured Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

      - name: Pull Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build exact reviewed commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact without changing domain aliases
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --skip-domain --token "$VERCEL_TOKEN"
