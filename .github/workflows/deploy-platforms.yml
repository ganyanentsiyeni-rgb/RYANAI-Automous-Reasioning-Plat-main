name: Push Deploy - Render, Railway, and Vercel

on:
  # The Push Deploy choice is the explicit release command. CI completion alone
  # never starts production deployment.
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact reviewed main SHA to release.
        required: true
        type: string
      push_deploy:
        description: Explicitly authorize independent provider deployment attempts after all release gates pass.
        required: true
        type: choice
        options:
          - NO
          - PUSH DEPLOY
        default: NO
      deploy_vercel:
        description: Opt in to the minimum-priority Vercel deployment; it runs independently of Render and Railway.
        required: false
        type: boolean
        default: false
      release_request_id:
        description: Optional PA Agent or Comms release-request reference.
        required: false
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: ryanai-push-deploy-${{ inputs.commit_sha || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci_cd:
    name: Re-run exact-SHA application CI/CD validation
    if: inputs.push_deploy == 'PUSH DEPLOY'
    uses: ./.github/workflows/ci-cd.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}

  gate:
    name: Exact-SHA CI and security release gate
    needs: ci_cd
    if: inputs.push_deploy == 'PUSH DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Check out release-gate scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate requested SHA
        id: sha
        env:
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid full commit SHA"; exit 1; }
          printf 'sha=%s\n' "$INPUT_SHA" >> "$GITHUB_OUTPUT"

      - name: Require exact current main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "$SHA" == "$main_sha" ]] || { echo "::error::Requested SHA is not current main"; exit 1; }

      - name: Wait for all required exact-SHA CI and security checks
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          current_suite="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CURRENT_RUN_ID}" --jq '.check_suite_id // empty')"
          [[ -n "$current_suite" ]] || { echo "::error::Cannot identify Push Deploy check suite"; exit 1; }
          mapfile -t required < <(jq -r '.contexts[].name' scripts/ci/required-release-check-producers.json)
          [[ $(printf '%s\\n' "${required[@]}" | wc -l) -eq 19 ]] || {
            echo "::error::Canonical release-check producer inventory must contain exactly 19 contexts"; exit 1;
          }
          for attempt in $(seq 1 90); do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" --jq '.check_runs[]' > check-runs.ndjson
            jq -s --arg suite "$current_suite" '[.[] | select((.check_suite.id | tostring) != $suite)]' check-runs.ndjson > checks.json
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" --jq '.workflow_runs' > workflow-runs.json
            REQUIRED_CHECKS_JSON="$(printf '%s\n' "${required[@]}" | jq -R . | jq -s .)"
            evaluation="$(REQUIRED_CHECKS_JSON="$REQUIRED_CHECKS_JSON" python3 <<'PY'
          import json
          import os
          import re
          from collections import defaultdict
          
          required = json.loads(os.environ["REQUIRED_CHECKS_JSON"])
          with open("checks.json", encoding="utf-8") as source:
              runs = json.load(source)
          with open("workflow-runs.json", encoding="utf-8") as source:
              workflow_runs = json.load(source)
          
          # CheckRun.check_suite exposes a suite ID but not the workflow ID. Resolve the
          # Actions run ID embedded in details_url against the exact-SHA workflow runs.
          workflow_by_run_id = {
              str(item["id"]): str(item["workflow_id"])
              for item in workflow_runs
              if item.get("id") is not None and item.get("workflow_id") is not None
          }
          
          # Keep independent workflows separate even when they publish the same context
          # through the same GitHub App. Within each producer, only its newest attempt is
          # authoritative, so an obsolete failed attempt cannot mask a successful rerun.
          grouped = defaultdict(list)
          for run in runs:
              name = run.get("name")
              if name not in required:
                  continue
              app = run.get("app") or {}
              app_id = str(app.get("id") or app.get("slug") or "unknown-app")
              details_url = run.get("details_url") or ""
              match = re.search(r"/actions/runs/(\d+)", details_url)
              if match and match.group(1) in workflow_by_run_id:
                  producer = "workflow:" + workflow_by_run_id[match.group(1)]
              elif match:
                  # Fail closed on unmapped Actions runs: distinct run IDs cannot hide
                  # one another, though an older failure may remain blocking until mapped.
                  producer = "unmapped-run:" + match.group(1)
              else:
                  # Non-Actions providers are separated by their own details/external ID.
                  producer = "external:" + str(run.get("external_id") or details_url or
                                               (run.get("check_suite") or {}).get("id") or "unknown")
              grouped[(name, app_id, producer)].append(run)
          
          pending = []
          failed = []
          missing = []
          for name in required:
              producers = [(key, values) for key, values in grouped.items() if key[0] == name]
              if not producers:
                  missing.append(name)
                  continue
              for (_, app_id, producer), values in producers:
                  latest = max(
                      values,
                      key=lambda item: (
                          item.get("started_at") or item.get("completed_at") or item.get("created_at") or "",
                          item.get("id") or 0,
                      ),
                  )
                  status = latest.get("status") or "missing"
                  conclusion = latest.get("conclusion") or ""
                  if status != "completed":
                      pending.append(f"{name} [{app_id}; {producer}]")
                  elif conclusion != "success":
                      failed.append(f"{name} [{app_id}; {producer}]: {conclusion or 'no conclusion'}")
          
          print(json.dumps({"pending": pending, "failed": failed, "missing": missing}))
          PY
            )"
            printf '%s\n' "$evaluation" | jq .
            failed="$(jq '.failed | length' <<< "$evaluation")"
            pending="$(jq '.pending | length' <<< "$evaluation")"
            missing="$(jq '.missing | length' <<< "$evaluation")"
            if [[ "$failed" -gt 0 ]]; then
              jq -r '.failed[] | "::error::Latest required check attempt failed: " + .' <<< "$evaluation"
              exit 1
            fi
            if [[ "$pending" -eq 0 && "$missing" -eq 0 ]]; then
              echo "Latest attempt for every required check context passed for exact SHA $SHA"
              exit 0
            fi
            echo "Waiting for required checks (attempt $attempt/90)."
            jq -r '(.pending[]?, .missing[]? | "Waiting: " + .)' <<< "$evaluation"
            sleep 30
          done
          echo "::error::Required exact-SHA CI/security checks did not all pass within 45 minutes"
          exit 1

  render:
    name: Priority 1 — Render deploy and health verification
    needs: gate
    if: ${{ needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - name: Deploy each configured Render service at the exact SHA
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_IDS: ${{ vars.RENDER_SERVICE_IDS }}
          RENDER_HEALTH_URLS: ${{ vars.RENDER_HEALTH_URLS }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "${RENDER_API_KEY:-}" && -n "${RENDER_SERVICE_IDS:-}" && -n "${RENDER_HEALTH_URLS:-}" ]] || {
            echo "::error::Render API key, service IDs, and health URLs are required"; exit 1;
          }
          IFS=',' read -ra services <<< "$RENDER_SERVICE_IDS"
          IFS=',' read -ra health_urls <<< "$RENDER_HEALTH_URLS"
          [[ "${#services[@]}" -gt 0 && "${#services[@]}" -eq "${#health_urls[@]}" ]] || {
            echo "::error::Render service IDs and health URLs must have matching non-zero entries"; exit 1;
          }
          overall=0
          echo "### Priority 1 — Render" >> "$GITHUB_STEP_SUMMARY"
          for index in "${!services[@]}"; do
            service_id="$(echo "${services[$index]}" | xargs)"
            health_url="$(echo "${health_urls[$index]}" | xargs)"
            [[ -n "$service_id" && -n "$health_url" ]] || { echo "::error::Empty Render target at index $index"; exit 1; }
            response="$(curl --silent --show-error --fail-with-body --request POST \
              --url "https://api.render.com/v1/services/${service_id}/deploys" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "$(jq -n --arg commitId "$DEPLOY_SHA" --arg deployMode "build_and_deploy" '{commitId:$commitId,deployMode:$deployMode}')")"
            deployment_id="$(jq -r '.id // empty' <<< "$response")"
            [[ -n "$deployment_id" ]] || { echo "::error::Render omitted deployment ID for $service_id"; exit 1; }
            status=""
            for attempt in $(seq 1 60); do
              final="$(curl --silent --show-error --fail-with-body \
                --url "https://api.render.com/v1/services/${service_id}/deploys/${deployment_id}" \
                --header "Authorization: Bearer ${RENDER_API_KEY}" \
                --header "accept: application/json")"
              status="$(jq -r '.status // empty' <<< "$final")"
              deployed_sha="$(jq -r '.commit.id // .commitId // empty' <<< "$final")"
              [[ "$deployed_sha" == "$DEPLOY_SHA" ]] || { echo "::error::Render deployment SHA mismatch or unavailable for $service_id"; exit 1; }
              [[ "$status" == "live" ]] && break
              [[ "$status" == "build_failed" || "$status" == "pre_deploy_failed" || "$status" == "update_failed" || "$status" == "deactivated" || "$status" == "canceled" ]] && break
              sleep 10
            done
            [[ "$status" == "live" ]] || { echo "::error::Render deployment $deployment_id did not reach live"; exit 1; }
            curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 10 --retry-max-time 180 "$health_url" >/dev/null
            echo "- $service_id — deployment $deployment_id — exact SHA and health passed" >> "$GITHUB_STEP_SUMMARY"
          done

  railway:
    name: Priority 2 — Railway deploy and health verification
    needs: gate
    if: ${{ needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Check out exact reviewed SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Validate Railway target and pinned CLI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_HEALTH_URL: ${{ vars.RAILWAY_HEALTH_URL }}
          RAILWAY_CLI_VERSION: ${{ vars.RAILWAY_CLI_VERSION }}
        run: |
          set -euo pipefail
          for key in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID RAILWAY_SERVICE_ID RAILWAY_HEALTH_URL RAILWAY_CLI_VERSION; do
            [[ -n "${!key:-}" ]] || { echo "::error::Missing Railway configuration: $key"; exit 1; }
          done
          npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"

      - name: Deploy checked-out exact SHA and verify runtime
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_HEALTH_URL: ${{ vars.RAILWAY_HEALTH_URL }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          before="$(railway deployment list --json --limit 1 --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" 2>/dev/null | jq -r '.[0].id // empty' || true)"
          railway up --ci --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --project "$RAILWAY_PROJECT_ID" --message "RyanAI Push Deploy $DEPLOY_SHA"
          deployment_id=""
          status=""
          for attempt in $(seq 1 60); do
            deployments="$(railway deployment list --json --limit 10 --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID")"
            deployment_id="$(jq -r --arg before "$before" '[.[] | select(.id != $before)][0].id // empty' <<< "$deployments")"
            status="$(jq -r --arg id "$deployment_id" '.[] | select(.id == $id) | .status' <<< "$deployments" | head -n1)"
            [[ -n "$deployment_id" && "$status" == "SUCCESS" ]] && break
            [[ "$status" == "FAILED" || "$status" == "CRASHED" || "$status" == "REMOVED" ]] && { echo "::error::Railway deployment reached $status"; exit 1; }
            sleep 10
          done
          [[ -n "$deployment_id" && "$status" == "SUCCESS" ]] || { echo "::error::Railway deployment did not reach SUCCESS"; exit 1; }
          curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 10 --retry-max-time 180 "$RAILWAY_HEALTH_URL" >/dev/null
          echo "### Priority 2 — Railway" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment ID: $deployment_id" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: $DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime health: passed" >> "$GITHUB_STEP_SUMMARY"

  vercel:
    name: Priority 3 — Minimum Vercel deployment (opt-in)
    needs: gate
    if: ${{ needs.gate.result == 'success' && inputs.deploy_vercel == true }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out exact reviewed SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Deploy minimum Vercel workload and verify runtime
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
          VERCEL_HEALTH_URL: ${{ vars.VERCEL_HEALTH_URL }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_CLI_VERSION VERCEL_HEALTH_URL; do
            [[ -n "${!key:-}" ]] || { echo "::error::Missing Vercel configuration: $key"; exit 1; }
          done
          npm install --global "vercel@${VERCEL_CLI_VERSION}"
          vercel link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          deploy_output="$(vercel deploy --prebuilt --prod --skip-domain --token "$VERCEL_TOKEN" 2>&1)"
          echo "$deploy_output"
          deployment_url="$(printf '%s\n' "$deploy_output" | grep -Eo 'https://[^[:space:]]+' | tail -n1 | sed 's/[),]$//')"
          [[ "$deployment_url" == https://* ]] || { echo "::error::Vercel did not return a deployment URL"; exit 1; }
          health_path="$(printf '%s' "$VERCEL_HEALTH_URL" | sed -E 's#^https?://[^/]+##')"
          [[ -n "$health_path" ]] || health_path="/"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 90 "${deployment_url}${health_path}" >/dev/null
          echo "### Priority 3 — Vercel (minimum)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment URL: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: $DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime health: passed" >> "$GITHUB_STEP_SUMMARY"
