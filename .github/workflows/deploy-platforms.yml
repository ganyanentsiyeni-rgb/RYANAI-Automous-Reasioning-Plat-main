name: Push Deploy - Render, Railway, and Vercel

on:
  # The Push Deploy choice is the explicit release command. CI completion alone
  # never starts production deployment.
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact reviewed main SHA to release.
        required: true
        type: string
      push_deploy:
        description: Explicitly authorize the ordered production release.
        required: true
        type: choice
        options:
          - NO
          - PUSH DEPLOY
        default: NO
      deploy_vercel:
        description: Opt in to the minimum-priority Vercel deployment after Render and Railway succeed.
        required: false
        type: boolean
        default: false
      release_request_id:
        description: Optional PA Agent or Comms release-request reference.
        required: false
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: ryanai-push-deploy-${{ inputs.commit_sha || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci_cd:
    name: Re-run exact-SHA application CI/CD validation
    if: inputs.push_deploy == 'PUSH DEPLOY'
    uses: ./.github/workflows/ci-cd.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}

  gate:
    name: Exact-SHA CI and security release gate
    needs: ci_cd
    if: inputs.push_deploy == 'PUSH DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Validate requested SHA
        id: sha
        env:
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid full commit SHA"; exit 1; }
          printf 'sha=%s\n' "$INPUT_SHA" >> "$GITHUB_OUTPUT"

      - name: Require exact current main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "$SHA" == "$main_sha" ]] || { echo "::error::Requested SHA is not current main"; exit 1; }

      - name: Wait for all required exact-SHA CI and security checks
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          current_suite="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CURRENT_RUN_ID}" --jq '.check_suite_id // empty')"
          [[ -n "$current_suite" ]] || { echo "::error::Cannot identify Push Deploy check suite"; exit 1; }
          required=(
            "Validate (typecheck, lint, test, build)"
            "MCP server and workflow worker"
            "Integration and end-to-end checks"
            "PostgreSQL 19 compatibility"
            "Issue 435 migrations and attachment security"
            "Audit Render API configuration (read-only)"
            "validate-database"
            "Upgrade legacy pgvector database safely (quoted)"
            "Upgrade legacy pgvector database safely (unquoted)"
            "Test agent API contracts"
            "Dependency audit"
            "Trivy filesystem scan"
            "Analyze (javascript-typescript)"
            "Analyze (python)"
            "TruffleHog secret audit"
            "Codacy Security Scan"
            "Scan api image"
            "Scan web image"
            "Generate & Upload SBOMs"
          )
          for attempt in $(seq 1 90); do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" --jq '.check_runs[]' > check-runs.ndjson
            jq -s --arg suite "$current_suite" '[.[] | select((.check_suite.id | tostring) != $suite)]' check-runs.ndjson > checks.json
            pending=0
            failed=0
            missing=()
            for name in "${required[@]}"; do
              count="$(jq --arg name "$name" '[.[] | select(.name == $name)] | length' checks.json)"
              if [[ "$count" == "0" ]]; then
                missing+=("$name")
                pending=1
                continue
              fi
              state="$(jq -r --arg name "$name" '[.[] | select(.name == $name)] | sort_by(.started_at // .completed_at // "") | last | [.status // "missing", .conclusion // ""] | @tsv' checks.json)"
              status="${state%%$'\t'*}"
              conclusion="${state#*$'\t'}"
              if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
                continue
              elif [[ "$status" == "completed" ]]; then
                echo "::error::Required check $name concluded $conclusion"
                failed=1
              else
                pending=1
              fi
            done
            [[ "$failed" == "0" ]] || exit 1
            if [[ "$pending" == "0" ]]; then
              echo "All required checks passed for exact SHA $SHA"
              exit 0
            fi
            echo "Waiting for checks (attempt $attempt/90). Missing: ${missing[*]:-none}"
            sleep 30
          done
          echo "::error::Required exact-SHA CI/security checks did not all pass within 45 minutes"
          exit 1

  render:
    name: Priority 1 — Render deploy and health verification
    needs: gate
    if: ${{ needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - name: Deploy each configured Render service at the exact SHA
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_IDS: ${{ vars.RENDER_SERVICE_IDS }}
          RENDER_HEALTH_URLS: ${{ vars.RENDER_HEALTH_URLS }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "${RENDER_API_KEY:-}" && -n "${RENDER_SERVICE_IDS:-}" && -n "${RENDER_HEALTH_URLS:-}" ]] || {
            echo "::error::Render API key, service IDs, and health URLs are required"; exit 1;
          }
          IFS=',' read -ra services <<< "$RENDER_SERVICE_IDS"
          IFS=',' read -ra health_urls <<< "$RENDER_HEALTH_URLS"
          [[ "${#services[@]}" -gt 0 && "${#services[@]}" -eq "${#health_urls[@]}" ]] || {
            echo "::error::Render service IDs and health URLs must have matching non-zero entries"; exit 1;
          }
          overall=0
          echo "### Priority 1 — Render" >> "$GITHUB_STEP_SUMMARY"
          for index in "${!services[@]}"; do
            service_id="$(echo "${services[$index]}" | xargs)"
            health_url="$(echo "${health_urls[$index]}" | xargs)"
            [[ -n "$service_id" && -n "$health_url" ]] || { echo "::error::Empty Render target at index $index"; exit 1; }
            response="$(curl --silent --show-error --fail-with-body --request POST \
              --url "https://api.render.com/v1/services/${service_id}/deploys" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "$(jq -n --arg commitId "$DEPLOY_SHA" --arg deployMode "build_and_deploy" '{commitId:$commitId,deployMode:$deployMode}')")"
            deployment_id="$(jq -r '.id // empty' <<< "$response")"
            [[ -n "$deployment_id" ]] || { echo "::error::Render omitted deployment ID for $service_id"; exit 1; }
            status=""
            for attempt in $(seq 1 60); do
              final="$(curl --silent --show-error --fail-with-body \
                --url "https://api.render.com/v1/services/${service_id}/deploys/${deployment_id}" \
                --header "Authorization: Bearer ${RENDER_API_KEY}" \
                --header "accept: application/json")"
              status="$(jq -r '.status // empty' <<< "$final")"
              deployed_sha="$(jq -r '.commit.id // .commitId // empty' <<< "$final")"
              [[ "$deployed_sha" == "$DEPLOY_SHA" ]] || { echo "::error::Render deployment SHA mismatch or unavailable for $service_id"; exit 1; }
              [[ "$status" == "live" ]] && break
              [[ "$status" == "build_failed" || "$status" == "pre_deploy_failed" || "$status" == "update_failed" || "$status" == "deactivated" || "$status" == "canceled" ]] && break
              sleep 10
            done
            [[ "$status" == "live" ]] || { echo "::error::Render deployment $deployment_id did not reach live"; exit 1; }
            curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 10 --retry-max-time 180 "$health_url" >/dev/null
            echo "- $service_id — deployment $deployment_id — exact SHA and health passed" >> "$GITHUB_STEP_SUMMARY"
          done

  railway:
    name: Priority 2 — Railway deploy and health verification
    needs: [gate, render]
    if: ${{ needs.gate.result == 'success' && needs.render.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Check out exact reviewed SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Validate Railway target and pinned CLI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_HEALTH_URL: ${{ vars.RAILWAY_HEALTH_URL }}
          RAILWAY_CLI_VERSION: ${{ vars.RAILWAY_CLI_VERSION }}
        run: |
          set -euo pipefail
          for key in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID RAILWAY_SERVICE_ID RAILWAY_HEALTH_URL RAILWAY_CLI_VERSION; do
            [[ -n "${!key:-}" ]] || { echo "::error::Missing Railway configuration: $key"; exit 1; }
          done
          npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"

      - name: Deploy checked-out exact SHA and verify runtime
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_HEALTH_URL: ${{ vars.RAILWAY_HEALTH_URL }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          before="$(railway deployment list --json --limit 1 --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" 2>/dev/null | jq -r '.[0].id // empty' || true)"
          railway up --ci --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --project "$RAILWAY_PROJECT_ID" --message "RyanAI Push Deploy $DEPLOY_SHA"
          deployment_id=""
          status=""
          for attempt in $(seq 1 60); do
            deployments="$(railway deployment list --json --limit 10 --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID")"
            deployment_id="$(jq -r --arg before "$before" '[.[] | select(.id != $before)][0].id // empty' <<< "$deployments")"
            status="$(jq -r --arg id "$deployment_id" '.[] | select(.id == $id) | .status' <<< "$deployments" | head -n1)"
            [[ -n "$deployment_id" && "$status" == "SUCCESS" ]] && break
            [[ "$status" == "FAILED" || "$status" == "CRASHED" || "$status" == "REMOVED" ]] && { echo "::error::Railway deployment reached $status"; exit 1; }
            sleep 10
          done
          [[ -n "$deployment_id" && "$status" == "SUCCESS" ]] || { echo "::error::Railway deployment did not reach SUCCESS"; exit 1; }
          curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 10 --retry-max-time 180 "$RAILWAY_HEALTH_URL" >/dev/null
          echo "### Priority 2 — Railway" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment ID: $deployment_id" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: $DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime health: passed" >> "$GITHUB_STEP_SUMMARY"

  render:
    name: Render deploy and health verification
    needs: gate
    if: ${{ always() && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - name: Deploy and verify every configured Render service independently
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_IDS: ${{ vars.RENDER_SERVICE_IDS }}
          RENDER_HEALTH_URLS: ${{ vars.RENDER_HEALTH_URLS }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "${RENDER_API_KEY:-}" ]] || { echo "::error::RENDER_API_KEY is not configured"; exit 1; }
          [[ -n "${RENDER_SERVICE_IDS:-}" ]] || { echo "::error::RENDER_SERVICE_IDS is not configured"; exit 1; }
          [[ -n "${RENDER_HEALTH_URLS:-}" ]] || { echo "::error::RENDER_HEALTH_URLS is not configured"; exit 1; }
          IFS=',' read -ra services <<< "$RENDER_SERVICE_IDS"
          IFS=',' read -ra health_urls <<< "$RENDER_HEALTH_URLS"
          [[ "${#services[@]}" -gt 0 && "${#services[@]}" -eq "${#health_urls[@]}" ]] || {
            echo "::error::RENDER_SERVICE_IDS and RENDER_HEALTH_URLS must contain the same non-zero number of comma-separated entries."
            exit 1
          }
          overall=0
          echo "### Render" >> "$GITHUB_STEP_SUMMARY"
          for index in "${!services[@]}"; do
            service_id="$(echo "${services[$index]}" | xargs)"
            health_url="$(echo "${health_urls[$index]}" | xargs)"
            [[ -n "$service_id" && -n "$health_url" ]] || { echo "::error::Empty Render service/health entry at index $index"; overall=1; continue; }
            response="$(curl --silent --show-error --fail-with-body --request POST \
              --url "https://api.render.com/v1/services/${service_id}/deploys" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "$(jq -n --arg commitId "$DEPLOY_SHA" --arg deployMode "build_and_deploy" '{commitId:$commitId,deployMode:$deployMode}')")" || {
                echo "- $service_id: deploy request failed" >> "$GITHUB_STEP_SUMMARY"; overall=1; continue;
              }
            deployment_id="$(echo "$response" | jq -r '.id // empty')"
            if [[ -z "$deployment_id" ]]; then
              echo "- $service_id: provider response missing deployment ID" >> "$GITHUB_STEP_SUMMARY"; overall=1; continue
            fi
            status=""
            for attempt in $(seq 1 60); do
              status="$(curl --silent --show-error --fail \
                --header "Authorization: Bearer ${RENDER_API_KEY}" \
                "https://api.render.com/v1/services/${service_id}/deploys/${deployment_id}" | jq -r '.status // empty' || true)"
              [[ "$status" == "live" ]] && break
              [[ "$status" == "build_failed" || "$status" == "pre_deploy_failed" || "$status" == "update_failed" || "$status" == "deactivated" ]] && break
              sleep 10
            done
            if [[ "$status" != "live" ]]; then
              echo "- $service_id · $deployment_id: deployment status ${status:-unknown}" >> "$GITHUB_STEP_SUMMARY"; overall=1; continue
            fi
            if curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 10 --retry-max-time 180 "$health_url" >/dev/null; then
              echo "- $service_id · $deployment_id: live; health passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $service_id · $deployment_id: live; health failed" >> "$GITHUB_STEP_SUMMARY"; overall=1
          set -uo pipefail
          overall=0
          echo "### Render" >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "${RENDER_API_KEY:-}" || -z "${RENDER_SERVICE_IDS:-}" || -z "${RENDER_HEALTH_URLS:-}" ]]; then
            echo "::error::Render credentials or service/health configuration is missing."
            exit 1
          fi
          IFS=',' read -ra services <<< "$RENDER_SERVICE_IDS"
          IFS=',' read -ra health_urls <<< "$RENDER_HEALTH_URLS"
          if [[ "${#services[@]}" -eq 0 || "${#services[@]}" -ne "${#health_urls[@]}" ]]; then
            echo "::error::Render service IDs and health URLs must have the same non-zero number of entries."
            exit 1
          fi
          for index in "${!services[@]}"; do
            service_id="$(echo "${services[$index]}" | xargs)"
            health_url="$(echo "${health_urls[$index]}" | xargs)"
            if [[ -z "$service_id" || -z "$health_url" ]]; then
              echo "- Entry $index: missing service ID or health URL" >> "$GITHUB_STEP_SUMMARY"
              overall=1
              continue
            fi
            response="$(curl --silent --show-error --fail-with-body --request POST               --url "https://api.render.com/v1/services/${service_id}/deploys"               --header "Authorization: Bearer ${RENDER_API_KEY}"               --header "Content-Type: application/json"               --data "$(jq -n --arg commitId "$DEPLOY_SHA" --arg deployMode "build_and_deploy" '{commitId:$commitId,deployMode:$deployMode}')")" || {
                echo "- $service_id: deploy request failed" >> "$GITHUB_STEP_SUMMARY"
                overall=1
                continue
              }
            deployment_id="$(jq -r '.id // empty' <<< "$response")"
            if [[ -z "$deployment_id" ]]; then
              echo "- $service_id: provider response omitted deployment ID" >> "$GITHUB_STEP_SUMMARY"
              overall=1
              continue
            fi
            status=""
            for attempt in $(seq 1 60); do
              final="$(curl --silent --show-error --fail-with-body                 --url "https://api.render.com/v1/services/${service_id}/deploys/${deployment_id}"                 --header "Authorization: Bearer ${RENDER_API_KEY}"                 --header "accept: application/json")" || { status="provider_error"; break; }
              status="$(jq -r '.status // empty' <<< "$final")"
              deployed_sha="$(jq -r '.commit.id // .commitId // empty' <<< "$final")"
              if [[ -n "$deployed_sha" && "$deployed_sha" != "$DEPLOY_SHA" ]]; then
                status="unexpected_sha"
                break
              fi
              [[ "$status" == "live" ]] && break
              [[ "$status" == "build_failed" || "$status" == "pre_deploy_failed" || "$status" == "update_failed" || "$status" == "deactivated" || "$status" == "canceled" ]] && break
              sleep 10
            done
            if [[ "$status" != "live" ]]; then
              echo "- $service_id · $deployment_id: deployment failed or not live (${status:-unknown})" >> "$GITHUB_STEP_SUMMARY"
              overall=1
              continue
            fi
            if curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 10 --retry-max-time 180 "$health_url" >/dev/null; then
              echo "- $service_id · $deployment_id: live at $DEPLOY_SHA; health passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $service_id · $deployment_id: live; health failed" >> "$GITHUB_STEP_SUMMARY"
              overall=1
            fi
          done
          exit "$overall"

  vercel:
    name: Priority 3 — Minimum Vercel deployment (opt-in)
    needs: [gate, render, railway]
    if: ${{ needs.gate.result == 'success' && needs.render.result == 'success' && needs.railway.result == 'success' && inputs.deploy_vercel == true }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    timeout-minutes: 15
    steps:
      - name: Check out exact reviewed SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Deploy minimum Vercel workload and verify runtime
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
          VERCEL_HEALTH_URL: ${{ vars.VERCEL_HEALTH_URL }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_CLI_VERSION VERCEL_HEALTH_URL; do
            [[ -n "${!key:-}" ]] || { echo "::error::Missing Vercel configuration: $key"; exit 1; }
          done
          npm install --global "vercel@${VERCEL_CLI_VERSION}"
          vercel link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          deploy_output="$(vercel deploy --prebuilt --prod --skip-domain --token "$VERCEL_TOKEN" 2>&1)"
          echo "$deploy_output"
          deployment_url="$(printf '%s\n' "$deploy_output" | grep -Eo 'https://[^[:space:]]+' | tail -n1 | sed 's/[),]$//')"
          [[ "$deployment_url" == https://* ]] || { echo "::error::Vercel did not return a deployment URL"; exit 1; }
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 90 "$VERCEL_HEALTH_URL" >/dev/null
          echo "### Priority 3 — Vercel (minimum)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment URL: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: $DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime health: passed" >> "$GITHUB_STEP_SUMMARY"
