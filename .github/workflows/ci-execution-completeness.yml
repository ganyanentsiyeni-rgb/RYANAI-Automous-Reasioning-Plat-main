name: CI execution completeness

on:
  # This gate validates PR check contexts on the PR head SHA. A post-merge
  # push produces a new merge SHA that never carried the PR's check contexts,
  # so running the same exact-SHA assertion on main is structurally invalid.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: ci-execution-completeness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: CI execution completeness
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Checkout candidate SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify required CI contexts execute on this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/ci/verify-ci-execution.mjs scripts/ci/required-release-checks.json "${GITHUB_SHA}" 1800
