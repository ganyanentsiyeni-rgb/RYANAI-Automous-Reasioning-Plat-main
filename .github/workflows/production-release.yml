name: Governed Production Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      confirm:
        description: "Type RELEASE to confirm this manually requested release"
        required: true
        type: string
      production_migration_approval:
        description: "For production only, type APPROVE_PRODUCTION_MIGRATIONS after separate owner approval"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ryanai-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release-production:
    if: github.ref == 'refs/heads/main' && inputs.environment == 'production' && inputs.confirm == 'RELEASE' && inputs.production_migration_approval == 'APPROVE_PRODUCTION_MIGRATIONS'
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 60
    env:
      RYANAI_PRODUCTION_RELEASE_APPROVED: "true"
      RYANAI_DEPLOYMENT_ENVIRONMENT: production
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_MIGRATION_NAME: ${{ vars.PRODUCTION_MIGRATION_NAME }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SESSION_POOLER_HOST: ${{ vars.SUPABASE_SESSION_POOLER_HOST }}
      SUPABASE_SSL_ROOT_CERT_PATH: ${{ vars.SUPABASE_SSL_ROOT_CERT_PATH }}
      PAGERDUTY_TOKEN: ${{ secrets.PAGERDUTY_TOKEN }}
      PAGERDUTY_USER_EMAIL: ${{ secrets.PAGERDUTY_USER_EMAIL }}
      PAGERDUTY_SERVICE_IDS: ${{ secrets.PAGERDUTY_SERVICE_IDS }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
      PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
      PRODUCTION_ROLLOUT_COMMAND: ${{ vars.PRODUCTION_ROLLOUT_COMMAND }}
      DEPLOYMENT_LOG_FILE: deployment-logs/release.log
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: |
          npm ci --legacy-peer-deps
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run offline PagerDuty and deployment contract tests
        run: |
          npm run test:pagerduty
          python scripts/run_unittest_discovery.py --start-directory scripts --pattern test_deploy_production.py

      - name: Execute governed production release
        run: python scripts/deploy_production.py

      - name: Upload structured deployment log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ryanai-production-release-log-${{ github.run_id }}
          path: deployment-logs/release.log
          if-no-files-found: ignore

      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          MESSAGE: "RyanAI production release succeeded | commit ${{ github.sha }} | run ${{ github.run_id }} | actor ${{ github.actor }}"
        run: |
          python - <<'PY'
          import json, os, urllib.request
          data = json.dumps({"text": os.environ["MESSAGE"]}).encode()
          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=10) as response:
              if response.status >= 300:
                  raise SystemExit(f"Slack notification failed with HTTP {response.status}")
          PY

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          MESSAGE: "RyanAI production release FAILED | commit ${{ github.sha }} | run ${{ github.run_id }} | actor ${{ github.actor }} | inspect workflow logs and PagerDuty state"
        run: |
          python - <<'PY'
          import json, os, urllib.request
          data = json.dumps({"text": os.environ["MESSAGE"]}).encode()
          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=10) as response:
              if response.status >= 300:
                  raise SystemExit(f"Slack notification failed with HTTP {response.status}")
          PY

  release-staging:
    if: github.ref == 'refs/heads/main' && inputs.environment == 'staging' && inputs.confirm == 'RELEASE'
    runs-on: ubuntu-latest
    environment:
      name: staging
    timeout-minutes: 60
    env:
      RYANAI_PRODUCTION_RELEASE_APPROVED: "true"
      RYANAI_DEPLOYMENT_ENVIRONMENT: staging
      NODE_ENV: staging
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      PAGERDUTY_TOKEN: ${{ secrets.PAGERDUTY_TOKEN }}
      PAGERDUTY_USER_EMAIL: ${{ secrets.PAGERDUTY_USER_EMAIL }}
      PAGERDUTY_SERVICE_IDS: ${{ secrets.PAGERDUTY_SERVICE_IDS }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
      PRODUCTION_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
      PRODUCTION_ROLLOUT_COMMAND: ${{ vars.STAGING_ROLLOUT_COMMAND }}
      DEPLOYMENT_LOG_FILE: deployment-logs/release.log
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: |
          npm ci --legacy-peer-deps
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run offline PagerDuty and deployment contract tests
        run: |
          npm run test:pagerduty
          python scripts/run_unittest_discovery.py --start-directory scripts --pattern test_deploy_production.py

      - name: Execute governed staging release
        run: python scripts/deploy_production.py

      - name: Upload structured deployment log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ryanai-staging-release-log-${{ github.run_id }}
          path: deployment-logs/release.log
          if-no-files-found: ignore

      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          MESSAGE: "RyanAI staging release succeeded | commit ${{ github.sha }} | run ${{ github.run_id }} | actor ${{ github.actor }}"
        run: |
          python - <<'PY'
          import json, os, urllib.request
          data = json.dumps({"text": os.environ["MESSAGE"]}).encode()
          req = urllib.request.Request(os.environ["SLACK_WEBHOOK_URL"], data=data, headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=10) as response:
              if response.status >= 300:
                  raise SystemExit(f"Slack notification failed with HTTP {response.status}")
          PY

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          MESSAGE: "RyanAI staging release FAILED | commit ${{ github.sha }} | run ${{ github.run_id }} | actor ${{ github.actor }}"
        run: |
          python - <<'PY'
          import json, os, urllib.request
          data = json.dumps({"text": os.environ["MESSAGE"]}).encode()
          req = urllib.request.Request(os.environ["SLACK_WEBHOOK_URL"], data=data, headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=10) as response:
              if response.status >= 300:
                  raise SystemExit(f"Slack notification failed with HTTP {response.status}")
          PY
