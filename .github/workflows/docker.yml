name: Docker - Build and Publish Images

# PRs build images without a write-capable token. Only validated trusted refs publish.
on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.api'
      - 'Dockerfile'
      - 'index.html'
      - 'mcp-server/**'
      - 'docker-compose.yml'
      - 'docker-entrypoint.sh'
      - 'nginx.conf'
      - 'nginx.conf.template'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'prisma/**'
      - 'models/**'
      - 'app/**'
      - 'store/**'
      - 'stacks/**'
      - 'scripts/copy-server-assets.mjs'
      - '.github/workflows/ci.yml'
      - 'scripts/check-platform-wiring.mjs'
      - 'scripts/validate-github-workflows.mjs'
      - 'quant-engine/**'
      - 'certs/**'
      - 'scripts/backup-on-startup.mjs'
      - 'scripts/verify-node-ca.sh'
      - 'tsconfig*.json'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      publish_images:
        description: 'Explicitly authorize publishing API, web, and MCP images to GHCR'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-pr:
    name: Build ${{ matrix.image }}
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    # Build-only PR validation is independent of lint/tests; publishing remains gated by validate.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: Dockerfile
            target: api
          - image: standalone-api
            file: Dockerfile.api
            target: api
          - image: studio-worker
            file: Dockerfile
            target: studio-worker
          - image: web
            file: Dockerfile
            target: web
          - image: mcp
            file: mcp-server/Dockerfile
            target: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          tags: ryanai-${{ matrix.image }}:ci
          outputs: type=oci,dest=/tmp/ryanai-${{ matrix.image }}.tar
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Upload image artifact for downstream checks
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ matrix.image }}
          path: /tmp/ryanai-${{ matrix.image }}.tar
          if-no-files-found: error
          retention-days: 1

  scan-api-image:
    name: Scan api image
    needs: build-pr
    needs:
      - validate
      - build-pr
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Download API image artifact
        uses: actions/download-artifact@v7
        with:
          name: docker-image-api
          path: /tmp
      - name: Load API image
        run: docker load --input /tmp/ryanai-api.tar
      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ryanai-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  scan-web-image:
    name: Scan web image
    needs: build-pr
    needs:
      - validate
      - build-pr
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Download web image artifact
        uses: actions/download-artifact@v7
        with:
          name: docker-image-web
          path: /tmp
      - name: Load web image
        run: docker load --input /tmp/ryanai-web.tar
      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ryanai-web:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish:
    name: Build and publish ${{ matrix.image }}
    # Publishing is opt-in only. Pushes, tags, and PRs must never publish images.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.publish_images == true &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
      }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: Dockerfile
            target: api
          - image: web
            file: Dockerfile
            target: web
          - image: mcp
            file: mcp-server/Dockerfile
            target: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalize image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE: ${{ matrix.image }}
        run: |
          repo_lower=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${repo_lower}/$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ matrix.image == 'api' && 'org.opencontainers.image.description=RyanAI API runtime image' || '' }}
          annotations: ${{ matrix.image == 'api' && 'manifest:org.opencontainers.image.description=RyanAI API runtime image' || '' }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
