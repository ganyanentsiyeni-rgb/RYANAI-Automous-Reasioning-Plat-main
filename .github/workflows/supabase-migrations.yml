name: Supabase Migration Replay and Shared Rooms Authorization

on:
  push:
    branches: [main, master]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
      - "scripts/test-shared-rooms-rls.sql"
  pull_request:
    branches: [main, master]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
      - "scripts/test-shared-rooms-rls.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-migration-replay:
    name: Replay migrations and test Shared Rooms JWT authorization
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Start disposable local Supabase stack
        run: supabase start

      - name: Replay every committed Supabase migration from empty state
        run: supabase db reset

      - name: Lint the resulting local database
        run: supabase db lint --fail-on error

      - name: Exercise Shared Rooms policies with authenticated JWT subjects
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          test -n "${DB_URL:-}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/test-shared-rooms-rls.sql

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop
        continue-on-error: true
