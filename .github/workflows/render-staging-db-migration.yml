name: Guarded Render staging database migration

on:
  pull_request:
    paths:
      - ".github/workflows/render-staging-db-migration.yml"
      - "scripts/migrate-render-staging.mjs"
      - "scripts/migrate-render-staging.test.mjs"
      - "prisma/migrations/20261101110000_communications_and_langgraph_checkpoint/migration.sql"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      confirm_staging_migration:
        description: "Confirm the one-shot Comms + LangGraph migration to the isolated Render staging database"
        required: true
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: ryanai-render-staging-db-migration
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --ignore-scripts --legacy-peer-deps
      - name: Verify guarded migration target tests
        run: npm run test:render-staging-migration

  migrate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_staging_migration == 'yes' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --ignore-scripts --legacy-peer-deps
      - name: Apply the one-shot staging migration
        env:
          DATABASE_URL: ${{ secrets.RENDER_STAGING_DATABASE_URL }}
          RYANAI_STAGING_MIGRATION_APPROVED: "true"
        run: npm run db:migrate:render-staging
