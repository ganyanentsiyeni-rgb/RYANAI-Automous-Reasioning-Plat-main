name: Secret Scanning (TruffleHog)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  # "TruffleHog secret audit" is a required exact-commit check for production
  # migrations. A newer push to main must not cancel it. Only pull request
  # updates supersede older runs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: TruffleHog secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: trufflesecurity/trufflehog@v3.99.9
        with:
          extra_args: --results=verified,unknown
