name: RyanAI 30-minute health monitor

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read

concurrency:
  group: ryanai-30-minute-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out monitor logic
        uses: actions/checkout@v7

      - name: Test fail-closed CI summarizer
        run: node --test scripts/ryanai-monitor-ci.test.cjs

      - name: Check current main CI and U2EB public health endpoints
        uses: actions/github-script@v9
        env:
          API_HEALTH_URL: https://ryanai-api-u2eb.onrender.com/health
          FRONTEND_URL: https://ryanai-web-u2eb.onrender.com/
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const headSha = branch.data.commit.sha;
            const probe = async (url) => {
              const started = Date.now();
              try {
                const response = await fetch(url, {
                  method: 'GET',
                  redirect: 'follow',
                  headers: { 'user-agent': 'RyanAI-GitHub-Health-Monitor/2.0' },
                  signal: AbortSignal.timeout(20000),
                });
                return { state: response.ok ? 'up' : 'down', status: response.status, durationMs: Date.now() - started };
              } catch (error) {
                return { state: 'down', status: null, durationMs: Date.now() - started, error: error?.name || 'NetworkError' };
              }
            };
            const { summarizeCi } = require(process.env.GITHUB_WORKSPACE + '/scripts/ryanai-monitor-ci.cjs');
            const [checkRuns, combined, api, frontend] = await Promise.all([
              github.rest.checks.listForRef({ owner, repo, ref: headSha, per_page: 100 }),
              github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: headSha }).catch(() => ({ data: { state: 'unknown', statuses: [] } })),
              probe(process.env.API_HEALTH_URL),
              probe(process.env.FRONTEND_URL),
            ]);
            const ci = summarizeCi(checkRuns.data, combined.data);
            const fmt = (x) => x.status === null ? `${x.state}: ${x.error || 'no HTTP response'}` : `${x.state}: HTTP ${x.status} (${x.durationMs} ms)`;
            const rows = [
              ['Component', 'State', 'Evidence'],
              ['Main branch CI', ci.level, `${ci.counts.passed}/${ci.counts.total} passed; ${ci.counts.failed} failed; ${ci.counts.queued} queued; ${ci.counts.inProgress} running; required ${ci.counts.requiredPassed}/${ci.counts.requiredTotal}`],
              ['U2EB API', api.state, fmt(api)],
              ['U2EB frontend', frontend.state, fmt(frontend)],
            ];
            await core.summary
              .addHeading('RyanAI health snapshot')
              .addRaw(`Checked at ${new Date().toISOString()}\n\nMain SHA: ${headSha}`)
              .addTable(rows)
              .addLink('Main commit', branch.data.commit.html_url)
              .addRaw('\n\nRead-only monitor: no deploys, restarts, environment changes, database migrations, issue writes, or outbound communications.')
              .write();
            core.info(JSON.stringify({ headSha, ci, api, frontend }));
