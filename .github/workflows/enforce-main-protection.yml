name: Enforce reviewed main protection

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ENFORCE-REVIEWED-PROTECTION to update ruleset 27357206
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: enforce-main-protection
  cancel-in-progress: false

jobs:
  enforce:
    name: Apply and verify reviewed main protection
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation and administrator credential
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "ENFORCE-REVIEWED-PROTECTION" ]] || {
            echo "::error::Confirmation string did not match; ruleset was not changed"
            exit 1
          }
          [[ -n "$GH_ADMIN_TOKEN" ]] || {
            echo "::error::GH_ADMIN_TOKEN secret is missing; ruleset was not changed"
            exit 1
          }

      - name: Build complete reviewed ruleset payload
        run: |
          set -euo pipefail
          cat > ruleset.json <<'JSON'
          {
            "name": "main-protection",
            "target": "branch",
            "enforcement": "active",
            "bypass_actors": [],
            "conditions": {
              "ref_name": {
                "include": ["refs/heads/main"],
                "exclude": []
              }
            },
            "rules": [
              { "type": "deletion" },
              { "type": "non_fast_forward" },
              { "type": "required_linear_history" },
              {
                "type": "pull_request",
                "parameters": {
                  "required_approving_review_count": 0,
                  "dismiss_stale_reviews_on_push": true,
                  "require_code_owner_review": false,
                  "require_last_push_approval": false,
                  "require_extra_approval_for_unattributed_changes": false,
                  "required_review_thread_resolution": true,
                  "allowed_merge_methods": ["merge", "squash", "rebase"]
                }
              },
              {
                "type": "required_status_checks",
                "parameters": {
                  "strict_required_status_checks_policy": true,
                  "do_not_enforce_on_create": false,
                  "required_status_checks": [
                    { "context": "Single-owner release gate" },
                    { "context": "Validate (typecheck, lint, test, build)" },
                    { "context": "MCP server and workflow worker" },
                    { "context": "Issue 435 migrations and attachment security" },
                    { "context": "Analyze (javascript-typescript)" },
                    { "context": "Analyze (python)" },
                    { "context": "TruffleHog secret audit" }
                  ]
                }
              }
            ]
          }
          JSON
          python3 -m json.tool ruleset.json >/dev/null

      - name: Locate and update the existing main ruleset
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          RULESET_ID="27357206"
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/rulesets/${RULESET_ID}" \
            --input ruleset.json > ruleset-updated.json
          python3 -m json.tool ruleset-updated.json >/dev/null

      - name: Verify the live ruleset after update
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/rulesets/27357206" > ruleset-final.json

          python3 - <<'PY'
          import json

          with open("ruleset-final.json", encoding="utf-8") as source:
              data = json.load(source)

          assert data.get("id") == 27357206, "Unexpected ruleset ID"
          assert data.get("name") == "main-protection", "Unexpected ruleset name"
          assert data.get("enforcement") == "active", "Ruleset is not active"
          assert data.get("bypass_actors", []) == [], "Bypass actors must be empty"
          assert "refs/heads/main" in data.get("conditions", {}).get("ref_name", {}).get("include", []), "main branch condition missing"

          rules = {rule["type"]: rule.get("parameters", {}) for rule in data.get("rules", [])}
          assert {"deletion", "non_fast_forward", "required_linear_history", "pull_request", "required_status_checks"} <= set(rules), "A required protection rule is missing"

          pr = rules["pull_request"]
          assert pr.get("required_approving_review_count") == 0, "Single-owner mode requires zero approvals; the Single-owner release gate is the merge control"
          assert pr.get("dismiss_stale_reviews_on_push") is True, "Stale review dismissal must be enabled"
          assert pr.get("require_code_owner_review") is False, "Code-owner approval must not block a reviewed repository"
          assert pr.get("require_last_push_approval") is False, "Last-push approval cannot be required without a second reviewer"
          assert pr.get("require_extra_approval_for_unattributed_changes") is False, "Extra approval for unattributed changes cannot be required in reviewed mode"
          assert pr.get("required_review_thread_resolution") is True, "Review thread resolution must be required"

          checks = rules["required_status_checks"].get("required_status_checks", [])
          contexts = {item.get("context") for item in checks}
          required = {
              "Single-owner release gate",
              "Validate (typecheck, lint, test, build)",
              "MCP server and workflow worker",
              "Issue 435 migrations and attachment security",
              "Analyze (javascript-typescript)",
              "Analyze (python)",
              "TruffleHog secret audit",
          }
          assert len(checks) == len(required), "Required check list contains duplicates or unexpected entries"
          assert contexts == required, (
              f"Required check contexts differ; missing={sorted(required - contexts)}, "
              f"unexpected={sorted(contexts - required)}"
          )
          assert rules["required_status_checks"].get("strict_required_status_checks_policy") is True, "Strict status-check policy is disabled"

          print("Verified reviewed ruleset 27357206:")
          print(json.dumps({
              "enforcement": data["enforcement"],
              "bypass_actors": data.get("bypass_actors", []),
              "pull_request": pr,
              "required_status_checks": sorted(contexts),
          }, indent=2))
          PY
