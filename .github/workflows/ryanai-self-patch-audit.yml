name: RyanAI Self-Patch CI/CD Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read
  pull-requests: read

concurrency:
  group: ryanai-self-patch-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit RyanAI workflows, CI and repository governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      deployments: read
      pull-requests: read
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test audit classification and redaction
        run: node --test scripts/ryanai-self-patch-audit.test.mjs
      - name: Audit workflows, exact-head CI and repository governance
        id: audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ryanai-self-patch-audit.mjs > ryanai-self-patch-report.json
      - name: Upload read-only audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ryanai-self-patch-audit-${{ github.run_id }}
          path: ryanai-self-patch-report.json
          if-no-files-found: warn
          retention-days: 14
