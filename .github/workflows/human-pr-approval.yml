name: Single-owner release gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: single-owner-release-gate-${{ github.event.pull_request.number || github.event.review.pull_request_url }}
  cancel-in-progress: true

jobs:
  single-owner-release-gate:
    name: Single-owner release gate
    runs-on: ubuntu-latest
    steps:
      - name: Require an independent approval for the exact current PR head
        uses: actions/github-script@v9
        with:
          script: |
            const pull = context.payload.pull_request;
            if (!pull) {
              core.setFailed('Pull request payload is missing; refusing to pass the human-review gate.');
              return;
            }

            if (pull.draft) {
              core.setFailed('Draft PRs cannot satisfy the human-review gate.');
              return;
            }

            const author = pull.user?.login?.toLowerCase();
            const head = pull.head?.sha;
            if (!author || !head) {
              core.setFailed('PR author or current head SHA is unavailable.');
              return;
            }

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100
            });

            // Only each reviewer's latest submitted review counts. A later
            // COMMENTED or CHANGES_REQUESTED review supersedes an approval.
            const latestByReviewer = new Map();
            for (const review of reviews) {
              const login = review.user?.login?.toLowerCase();
              if (!login || !review.submitted_at) continue;
              const previous = latestByReviewer.get(login);
              if (!previous || new Date(review.submitted_at) > new Date(previous.submitted_at)) {
                latestByReviewer.set(login, review);
              }
            }

            const qualifying = [...latestByReviewer.entries()].filter(([login, review]) =>
              login !== author &&
              review.state === 'APPROVED' &&
              review.commit_id === head
            );

            if (qualifying.length === 0) {
              core.setFailed(
                `No independent human approval exists for exact PR head ${head}. Request a qualified reviewer; self-approval and approvals on older commits do not count.`
              );
              return;
            }

            core.info(`Independent human approval verified for PR #${pull.number} at ${head}: ${qualifying.map(([login]) => login).join(', ')}`);
