name: Human PR Approval Gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: human-pr-approval-${{ github.event.pull_request.number || github.event.number }}
  cancel-in-progress: true

jobs:
  require-independent-approval:
    name: Require independent human approval
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Verify at least one current approval from a non-author
        uses: actions/github-script@v9
        with:
          script: |
            const pull = context.payload.pull_request ?? context.payload.review?.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = pull.number;
            const author = pull.user.login.toLowerCase();
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: number, per_page: 100 }
            );

            // GitHub may contain multiple reviews per reviewer. Only each
            // reviewer's latest submitted state is relevant.
            const latest = new Map();
            for (const review of reviews.sort((a, b) =>
              new Date(a.submitted_at ?? 0) - new Date(b.submitted_at ?? 0)
            )) {
              if (!review.user?.login || !review.submitted_at) continue;
              latest.set(review.user.login.toLowerCase(), {
                state: review.state.toUpperCase(),
                commit_id: review.commit_id,
              });
            }

            const currentHead = pull.head.sha;
            const approvals = [...latest.entries()]
              .filter(([login, review]) =>
                login !== author &&
                review.state === 'APPROVED' &&
                review.commit_id === currentHead
              )
              .map(([login]) => login);

            if (approvals.length === 0) {
              core.setFailed(
                `No current independent human approval found for PR #${number}. PR author: @${author}. Request review; do not merge on queued/skipped checks or self-approval.`
              );
              return;
            }

            core.info(`Independent human approval recorded from: ${approvals.join(', ')}`);
