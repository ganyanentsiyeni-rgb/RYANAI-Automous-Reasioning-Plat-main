name: Env Contract Check

on:
  pull_request:
    paths:
      - '.env.example'
      - 'scripts/validate-env-contract.ts'
      - 'scripts/__tests__/validate-env-contract.test.ts'
      - '.github/workflows/env-contract-check.yml'

permissions:
  contents: read

jobs:
  verify-names-only-env:
    name: Verify Names-Only .env.example
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Enforce names-only contract
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(".env.example")
          if not path.exists():
              print("::error file=.env.example::.env.example is missing.")
              sys.exit(1)
          line_re = re.compile(r"^([A-Z][A-Z0-9_]*)=(.*)$")
          seen, errors = set(), []
          for idx, raw in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              m = line_re.match(line)
              if not m:
                  errors.append(f"Line {idx}: malformed declaration")
                  continue
              key, value = m.group(1), m.group(2).strip()
              if value:
                  errors.append(f"Line {idx} ({key}): non-empty value forbidden")
              if key in seen:
                  errors.append(f"Line {idx} ({key}): duplicate key")
              seen.add(key)
          if errors:
              for error in errors:
                  print(f"::error file=.env.example::{error}")
              sys.exit(1)
          print(f"Verified {len(seen)} names-only keys.")
          PY
