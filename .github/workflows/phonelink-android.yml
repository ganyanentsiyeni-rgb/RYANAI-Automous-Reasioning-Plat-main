name: PhoneLink Android companion

"on":
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/phonelink-android.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/phonelink-android.yml"

permissions:
  contents: read

jobs:
  android-build:
    name: Android PhoneLink debug build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Assemble PhoneLink
        working-directory: android
        run: gradle --no-daemon :phonelink:assembleDebug
