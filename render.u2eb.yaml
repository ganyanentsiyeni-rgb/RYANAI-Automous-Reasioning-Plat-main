# U2EB-only Render Blueprint.
# Deliberately excludes Production and all repair-only duplicate services.
# U2EB PostgreSQL is the explicitly selected Supabase project; credentials
# remain manual secrets and are never committed to this repository.
version: "1"

projects:
  - name: RyanAI
    environments:
      - name: U2EB
        permissions:
          protection: enabled
        services:
          - type: web
            name: ryanai-api-u2eb
            runtime: docker
            repo: https://github.com/ganyanentsiyeni-rgb/RYANAI-Automous-Reasioning-Plat-main
            branch: main
            region: oregon
            plan: free
            dockerfilePath: ./Dockerfile.api
            healthCheckPath: /health
            autoDeployTrigger: off
            envVars:
              - key: NODE_ENV
                value: staging
              - key: HOST
                value: 0.0.0.0
              - key: PORT
                value: "3000"
              - key: NODE_USE_SYSTEM_CA
                value: "1"
              # Supply the U2EB Supabase Session Pooler URI privately in Render.
              # Do not use the separate Render Postgres database reference here.
              - key: DATABASE_URL
                sync: false
              - key: REDIS_URL
                fromService:
                  name: ryanai-redis-u2eb
                  type: keyvalue
                  property: connectionString
              - key: SUPABASE_URL
                value: https://omqavyppdoniehseokvx.supabase.co
              - key: SUPABASE_SESSION_POOLER_HOST
                value: aws-1-eu-central-1.pooler.supabase.com
              - key: SUPABASE_SSL_ROOT_CERT_PATH
                value: /usr/local/share/ca-certificates/supabase-prod-ca-2021.crt
              - key: SUPABASE_ANON_KEY
                sync: false
              - key: SUPABASE_PUBLISHABLE_KEY
                sync: false
              # MCP credentials are manually managed and must match the MCP service.
              - key: RYANAI_MCP_DELEGATION_SECRET
                sync: false
              - key: RYANAI_MCP_SERVICE_TOKEN
                sync: false
              - key: RYANAI_MCP_HEALTH_URL
                value: https://ryanai-mcp-u2eb-u2eb.onrender.com/health
              - key: CORS_ORIGINS
                value: https://ryanai-web-u2eb.onrender.com
              - key: SCHEDULER_ENABLED
                value: "false"
              - key: ALERTS_ENABLED
                value: "false"
              - key: COMMUNICATIONS_ENABLED
                value: "false"
              - key: COMMUNICATION_ATTACHMENTS_ENABLED
                value: "false"
              - key: ATTACHMENT_SCANNER_ENABLED
                value: "false"
              - key: ATTACHMENT_ORPHAN_CLEANUP_ENABLED
                value: "false"
          - type: web
            name: ryanai-mcp-u2eb-u2eb
            runtime: docker
            repo: https://github.com/ganyanentsiyeni-rgb/RYANAI-Automous-Reasioning-Plat-main
            branch: main
            region: oregon
            plan: free
            dockerContext: .
            dockerfilePath: ./mcp-server/Dockerfile
            healthCheckPath: /health
            autoDeployTrigger: off
            envVars:
              - key: NODE_ENV
                value: production
              - key: MCP_HOST
                value: 0.0.0.0
              - key: MCP_ALLOWED_HOSTS
                value: ryanai-mcp-u2eb-u2eb.onrender.com
              - key: MCP_ALLOWED_ORIGINS
                value: https://ryanai-web-u2eb.onrender.com
              - key: RYANAI_API_BASE_URL
                value: https://ryanai-api-u2eb.onrender.com
              - key: RYANAI_API_HEALTH_URL
                value: https://ryanai-api-u2eb.onrender.com/health
              - key: RYANAI_MCP_ENABLED_TOOLS
                value: tool_registry,platform_health,ryanai_stack_manifest
              - key: RYANAI_MCP_DELEGATION_SECRET
                sync: false
              - key: RYANAI_MCP_SERVICE_TOKEN
                sync: false
          - type: web
            name: ryanai-web-u2eb
            runtime: static
            repo: https://github.com/ganyanentsiyeni-rgb/RYANAI-Automous-Reasioning-Plat-main
            branch: main
            buildCommand: npm ci --legacy-peer-deps && npm run build:web
            staticPublishPath: ./dist
            autoDeployTrigger: off
            envVars:
              - key: VITE_APP_ENV
                value: staging
              - key: VITE_API_BASE_URL
                fromService:
                  name: ryanai-api-u2eb
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
              - key: VITE_SUPABASE_URL
                value: https://omqavyppdoniehseokvx.supabase.co
              - key: VITE_SUPABASE_PUBLISHABLE_KEY
                sync: false
              - key: VITE_SUPABASE_ANON_KEY
                sync: false
          - type: keyvalue
            name: ryanai-redis-u2eb
            plan: free
            region: oregon
            ipAllowList: []
            maxmemoryPolicy: noeviction
