# U2EB-only Render Blueprint.
# Deliberately excludes Production and all repair-only duplicate services.
# The database is dedicated to U2EB and must not contain Production data.
version: "1"

projects:
  - name: RyanAI
    environments:
      - name: U2EB
        permissions:
          protection: enabled
        services:
          - type: web
            name: ryanai-api-u2eb
            runtime: docker
            repo: https://github.com/ganyanentsiyeni-rgb/RYANAI-Automous-Reasioning-Plat-main
            branch: main
            region: oregon
            plan: free
            dockerfilePath: ./Dockerfile.api
            healthCheckPath: /health
            autoDeployTrigger: off
            envVars:
              - key: NODE_ENV
                value: staging
              - key: HOST
                value: 0.0.0.0
              - key: NODE_USE_SYSTEM_CA
                value: "1"
              - key: DATABASE_URL
                fromDatabase:
                  name: ryanai_database_u2eb
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  name: ryanai-redis-u2eb
                  type: keyvalue
                  property: connectionString
              - key: SUPABASE_URL
                value: https://narsvpwymvlrhurqbthu.supabase.co
              - key: SUPABASE_SESSION_POOLER_HOST
                sync: false
              - key: SUPABASE_ANON_KEY
                sync: false
              - key: SUPABASE_PUBLISHABLE_KEY
                sync: false
              - key: CORS_ORIGINS
                value: https://ryanai-web-u2eb.onrender.com
              - key: SCHEDULER_ENABLED
                value: "false"
              - key: ALERTS_ENABLED
                value: "false"
              - key: COMMUNICATIONS_ENABLED
                value: "false"
              - key: COMMUNICATION_ATTACHMENTS_ENABLED
                value: "false"
              - key: ATTACHMENT_SCANNER_ENABLED
                value: "false"
              - key: ATTACHMENT_ORPHAN_CLEANUP_ENABLED
                value: "false"
          - type: web
            name: ryanai-web-u2eb
            runtime: static
            repo: https://github.com/ganyanentsiyeni-rgb/RYANAI-Automous-Reasioning-Plat-main
            branch: main
            buildCommand: npm ci --legacy-peer-deps && npm run build:web
            staticPublishPath: ./dist
            autoDeployTrigger: off
            envVars:
              - key: VITE_APP_ENV
                value: staging
              - key: VITE_API_BASE_URL
                fromService:
                  name: ryanai-api-u2eb
                  type: web
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: VITE_SUPABASE_URL
                value: https://narsvpwymvlrhurqbthu.supabase.co
              - key: VITE_SUPABASE_PUBLISHABLE_KEY
                sync: false
              - key: VITE_SUPABASE_ANON_KEY
                sync: false
          - type: keyvalue
            name: ryanai-redis-u2eb
            plan: free
            region: oregon
            ipAllowList: []
            maxmemoryPolicy: noeviction
        databases:
          - name: ryanai_database_u2eb
            plan: free
            region: oregon
            postgresMajorVersion: 18
