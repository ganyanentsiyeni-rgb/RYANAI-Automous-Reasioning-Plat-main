# Dedicated U2EB PostgreSQL only. This Blueprint intentionally manages no existing services or databases.
version: "1"

projects:
  - name: RyanAI
    environments:
      - name: U2EB
        permissions:
          protection: enabled
        databases:
          - name: ryanai-database-u2eb
            plan: free
            region: oregon
            postgresMajorVersion: "18"
            ipAllowList: []
