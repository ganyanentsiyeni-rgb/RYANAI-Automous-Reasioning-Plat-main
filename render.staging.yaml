# Isolated RyanAI runtime verification environment.
# Apply as a separate Render Blueprint/project. Never use production database credentials.
# Staging secrets and database URLs must be supplied explicitly in the Render Dashboard.
version: "1"

projects:
  - name: RyanAI Runtime Verification
    environments:
      - name: Staging
        services:
          - type: web
            name: ryanai-api-staging
            runtime: docker
            repo: https://github.com/ganyanentsiyeni-rgb/RYANAI-Automous-Reasioning-Plat-main
            branch: main
            plan: free
            region: oregon
            dockerContext: .
            dockerfilePath: ./Dockerfile.api
            autoDeployTrigger: off
            healthCheckPath: /health
            envVars:
              - key: NODE_ENV
                value: staging
              - key: HOST
                value: 0.0.0.0
              - key: DATABASE_URL
                sync: false
              - key: SUPABASE_URL
                sync: false
              - key: SUPABASE_SESSION_POOLER_HOST
                sync: false
              - key: SUPABASE_PUBLISHABLE_KEY
                sync: false
              - key: REDIS_URL
                fromService:
                  name: ryanai-redis-staging
                  type: keyvalue
                  property: connectionString
              - key: CORS_ORIGINS
                sync: false
              - key: SCHEDULER_ENABLED
                value: "false"
              - key: ALERTS_ENABLED
                value: "false"
              - key: COMMUNICATIONS_ENABLED
                value: "false"
              - key: COMMUNICATION_ATTACHMENTS_ENABLED
                value: "false"
              - key: ATTACHMENT_SCANNER_ENABLED
                value: "false"
              - key: ATTACHMENT_ORPHAN_CLEANUP_ENABLED
                value: "false"
          - type: keyvalue
            name: ryanai-redis-staging
            plan: free
            region: oregon
            maxmemoryPolicy: noeviction
            ipAllowList: []
