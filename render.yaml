# U2EB-only Render Blueprint.
# Deliberately excludes Production and all repair-only duplicate services.
version: "1"

projects:
  - name: RyanAI
    environments:
      - name: U2EB
        permissions:
          protection: enabled
        services:
          - type: web
            name: ryanai-api-u2eb
            runtime: docker
            repo: https://github.com/ganyanentsiyeni-rgb/RYANAI-Automous-Reasioning-Plat-main
            branch: main
            region: oregon
            plan: free
            # Root Directory must be the repository root. A folder value such as "Dockerfile.api" makes the Render build fail.
            rootDir: .
            dockerContext: .
            dockerfilePath: ./Dockerfile.api
            healthCheckPath: /health
            autoDeployTrigger: checksPass
            envVars:
              - key: NODE_ENV
                value: staging
              - key: HOST
                value: 0.0.0.0
              # Fail closed: never bind U2EB to the Production Render database.
              # Supply an explicitly approved, isolated U2EB database URL in Render.
              - key: DATABASE_URL
                sync: false
              - key: REDIS_URL
                fromService:
                  name: ryanai-redis-u2eb
                  type: keyvalue
                  property: connectionString
              # Require an explicitly verified U2EB Supabase project mapping.
              - key: SUPABASE_URL
                sync: false
              - key: SUPABASE_SESSION_POOLER_HOST
                sync: false
              - key: SUPABASE_ANON_KEY
                sync: false
              - key: SUPABASE_PUBLISHABLE_KEY
                sync: false
              # Brain credentials belong in the API runtime as well as GitHub Actions.
              # sync:false preserves existing values and never commits secret material.
              - key: NVIDIA_API_KEY
                sync: false
              - key: QWEN_API_KEY
                sync: false
              - key: TOGETHER_API_KEY
                sync: false
              - key: LOGIC_API_KEY
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              # OpenRouter is optional and server-side only; adding declarations does not provision credentials or enable a model.
              - key: OPENROUTER_API_KEY
                sync: false
              - key: OPENROUTER_API_ENDPOINT
                value: https://openrouter.ai/api/v1
              - key: OPENROUTER_MODEL_ALLOWLIST
                value: ~openai/gpt-latest,~anthropic/claude-sonnet-latest
              # Shared MCP signing/service credentials must match the MCP service; set from the existing Render test environment group.
              - key: RYANAI_MCP_DELEGATION_SECRET
                sync: false
              - key: RYANAI_MCP_SERVICE_TOKEN
                sync: false
              - key: RYANAI_MCP_HEALTH_URL
                value: https://ryanai-mcp-u2eb-u2eb-u2eb.onrender.com/health
              - key: CORS_ORIGINS
                value: https://ryanai-web-u2eb.onrender.com,https://ryanai-web-authfix.onrender.com,https://ryanai-web.onrender.com
              - key: SCHEDULER_ENABLED
                value: "false"
              - key: ALERTS_ENABLED
                value: "false"
              - key: COMMUNICATIONS_ENABLED
                value: "false"
              - key: COMMUNICATION_ATTACHMENTS_ENABLED
                value: "false"
              - key: ATTACHMENT_SCANNER_ENABLED
                value: "false"
              - key: ATTACHMENT_ORPHAN_CLEANUP_ENABLED
                value: "false"
          - type: web
            name: ryanai-mcp-u2eb-u2eb-u2eb
            runtime: docker
            repo: https://github.com/ganyanentsiyeni-rgb/RYANAI-Automous-Reasioning-Plat-main
            branch: main
            region: oregon
            plan: free
            dockerContext: .
            dockerfilePath: ./mcp-server/Dockerfile
            healthCheckPath: /health
            autoDeployTrigger: checksPass
            envVars:
              - key: NODE_ENV
                value: production
              - key: MCP_HOST
                value: 0.0.0.0
              - key: MCP_ALLOWED_HOSTS
                value: ryanai-mcp-u2eb-u2eb-u2eb.onrender.com
              - key: MCP_ALLOWED_ORIGINS
                value: https://ryanai-web-u2eb.onrender.com,https://ryanai-web-authfix.onrender.com
              - key: RYANAI_API_BASE_URL
                value: https://ryanai-api-u2eb.onrender.com
              - key: RYANAI_API_HEALTH_URL
                value: https://ryanai-api-u2eb.onrender.com/health
              - key: RYANAI_MCP_ENABLED_TOOLS
                value: tool_registry,platform_health,ryanai_stack_manifest
              - key: RYANAI_MCP_DELEGATION_SECRET
                sync: false
              - key: RYANAI_MCP_SERVICE_TOKEN
                sync: false
          - type: web
            runtime: static
            name: ryanai-web-u2eb
            repo: https://github.com/ganyanentsiyeni-rgb/RYANAI-Automous-Reasioning-Plat-main
            branch: main
            buildCommand: npm ci --legacy-peer-deps && npm run build:web
            staticPublishPath: ./dist
            autoDeployTrigger: checksPass
            envVars:
              - key: VITE_APP_ENV
                value: staging
              - key: VITE_API_BASE_URL
                fromService:
                  name: ryanai-api-u2eb
                  type: web
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              # Require an explicitly verified U2EB Supabase project mapping.
              - key: VITE_SUPABASE_URL
                sync: false
              - key: VITE_SUPABASE_PUBLISHABLE_KEY
                sync: false
          - type: keyvalue
            name: ryanai-redis-u2eb
            plan: free
            region: oregon
            ipAllowList: []
            maxmemoryPolicy: noeviction
        # No Production database is managed or referenced from U2EB.
