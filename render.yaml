# RyanAI Render infrastructure
# Proposal only: applying this Blueprint requires a separately reviewed Render sync.
# This Blueprint manages production resources only. Staging is defined in render.staging.yaml.
version: "1"

projects:
  - name: RyanAI
    environments:
      - name: Production
        permissions:
          protection: enabled
        envVarGroups:
          - name: ryanai-shared-production
            envVars:
              - key: SUPABASE_URL
                value: https://narsvpwymvlrhurqbthu.supabase.co
              - key: VITE_SUPABASE_URL
                value: https://narsvpwymvlrhurqbthu.supabase.co
          - name: ryanai-api-production
            envVars:
              - key: NODE_ENV
                value: production
              - key: COMMUNICATIONS_ENABLED
                value: "false"
              - key: COMMUNICATION_ATTACHMENTS_ENABLED
                value: "false"
              - key: ATTACHMENT_SCANNER_ENABLED
                value: "false"
              - key: ATTACHMENT_ORPHAN_CLEANUP_ENABLED
                value: "false"
              - key: CLAMAV_PORT
                value: "3310"
              - key: CLAMAV_TIMEOUT_MS
                value: "60000"
              - key: NVIDIA_API_ENDPOINT
                value: https://integrate.api.nvidia.com/v1
              - key: NVIDIA_MODEL
                value: nvidia/nemotron-3-ultra-550b-a55b
              - key: QWEN_API_ENDPOINT
                value: https://api.together.xyz/v1
              - key: QWEN_MODEL
                value: Qwen/Qwen3-235B-A22B-Instruct-2507-tput
              - key: LOGIC_API_ENDPOINT
                value: https://api.openai.com/v1
              - key: LOGIC_REASONING_MODEL
                value: gpt-4o-mini
              - key: RYANAI_GITHUB_REPOSITORY
                value: ganyanentsiyeni-rgb/RYANAI-Automous-Reasioning-Plat-main
              - key: RYANAI_GITHUB_BASE_BRANCH
                value: main
              - key: SMTP_PORT
                value: "465"
              - key: SMTP_FROM
                value: notifications@ryanai.org
              - key: RYANAI_OWNER_TITLE
                value: Sir G
              - key: RYANAI_OWNER_LANGUAGE
                value: ve-ZA
          - name: ryanai-web-production
            envVars:
              - key: VITE_APP_ENV
                value: production
        services:
          - type: web
            name: ryanai-web
            runtime: static
            repo: https://github.com/ganyanentsiyeni-rgb/RYANAI-Automous-Reasioning-Plat-main
            branch: main
            buildCommand: npm ci --legacy-peer-deps && npm run build:web
            staticPublishPath: ./dist
            autoDeployTrigger: off
            envVars:
              - fromGroup: ryanai-shared-production
              - fromGroup: ryanai-web-production
              # Resolve the public API hostname from the API service instead of
              # hardcoding a Render URL that can drift when the service is recreated.
              - key: VITE_API_BASE_URL
                fromService:
                  name: ryanai-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: VITE_SUPABASE_ANON_KEY
                sync: false
              - key: VITE_SUPABASE_PUBLISHABLE_KEY
                sync: false

          - type: web
            name: ryanai-api
            runtime: docker
            repo: https://github.com/ganyanentsiyeni-rgb/RYANAI-Automous-Reasioning-Plat-main
            branch: main
            region: oregon
            plan: free
            dockerfilePath: ./Dockerfile.api
            healthCheckPath: /health
            autoDeployTrigger: off
            envVars:
              - fromGroup: ryanai-shared-production
              - fromGroup: ryanai-api-production
              - key: DATABASE_URL
                sync: false
              - key: REDIS_URL
                fromService:
                  name: ryanai-redis
                  type: keyvalue
                  property: connectionString
              - key: SUPABASE_SESSION_POOLER_HOST
                sync: false
              - key: AUDIOBOOK_DATABASE_URL
                sync: false
              - key: AUDIOBOOK_DATABASE_URL_UNPOOLED
                sync: false
              - key: SUPABASE_ANON_KEY
                sync: false
              - key: SUPABASE_PUBLISHABLE_KEY
                sync: false
              - key: SUPABASE_SERVICE_ROLE_KEY
                sync: false
              - key: CLAMAV_HOST
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              - key: NVIDIA_API_KEY
                sync: false
              - key: QWEN_API_KEY
                sync: false
              - key: LOGIC_API_KEY
                sync: false
              - key: RYANAI_GITHUB_TOKEN
                sync: false
              - key: TWILIO_ACCOUNT_SID
                sync: false
              - key: TWILIO_AUTH_TOKEN
                sync: false
              - key: TWILIO_PHONE_NUMBER
                sync: false
              - key: TWILIO_WHATSAPP_NUMBER
                sync: false
              - key: RESEND_API_KEY
                sync: false
              - key: SMTP_HOST
                sync: false
              - key: SMTP_USER
                sync: false
              - key: SMTP_PASS
                sync: false
              - key: RYANAI_OWNER_PHONE
                sync: false
              - key: RYANAI_OWNER_EMAIL
                sync: false

          - type: keyvalue
            name: ryanai-redis
            plan: free
            region: oregon
            ipAllowList: []
            maxmemoryPolicy: noeviction

      - name: U2EB
        permissions:
          protection: enabled
        services:
          - type: web
            name: ryanai-api-u2eb
            runtime: docker
            repo: https://github.com/ganyanentsiyeni-rgb/RYANAI-Automous-Reasioning-Plat-main
            branch: main
            region: oregon
            plan: free
            dockerfilePath: ./Dockerfile.api
            healthCheckPath: /health
            autoDeployTrigger: off
            envVars:
              - key: NODE_ENV
                value: staging
              - key: HOST
                value: 0.0.0.0
              # Fail closed: never bind U2EB to the Production Render database.
              # Supply an explicitly approved, isolated U2EB database URL in Render.
              - key: DATABASE_URL
                sync: false
              - key: REDIS_URL
                fromService:
                  name: ryanai-redis-u2eb
                  type: keyvalue
                  property: connectionString
              # Require an explicitly verified U2EB Supabase project mapping.
              - key: SUPABASE_URL
                sync: false
              - key: SUPABASE_SESSION_POOLER_HOST
                sync: false
              - key: SUPABASE_ANON_KEY
                sync: false
              - key: SUPABASE_PUBLISHABLE_KEY
                sync: false
              - key: CORS_ORIGINS
                value: https://ryanai-web-u2eb.onrender.com
              - key: SCHEDULER_ENABLED
                value: "false"
              - key: ALERTS_ENABLED
                value: "false"
              - key: COMMUNICATIONS_ENABLED
                value: "false"
              - key: COMMUNICATION_ATTACHMENTS_ENABLED
                value: "false"
              - key: ATTACHMENT_SCANNER_ENABLED
                value: "false"
              - key: ATTACHMENT_ORPHAN_CLEANUP_ENABLED
                value: "false"
          - type: web
            name: ryanai-web-u2eb
            runtime: static
            repo: https://github.com/ganyanentsiyeni-rgb/RYANAI-Automous-Reasioning-Plat-main
            branch: main
            buildCommand: npm ci --legacy-peer-deps && npm run build:web
            staticPublishPath: ./dist
            autoDeployTrigger: off
            envVars:
              - key: VITE_APP_ENV
                value: staging
              - key: VITE_API_BASE_URL
                fromService:
                  name: ryanai-api-u2eb
                  type: web
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              # Require an explicitly verified U2EB Supabase project mapping.
              - key: VITE_SUPABASE_URL
                sync: false
              - key: VITE_SUPABASE_PUBLISHABLE_KEY
                sync: false
              - key: VITE_SUPABASE_ANON_KEY
                sync: false
          - type: keyvalue
            name: ryanai-redis-u2eb
            plan: free
            region: oregon
            ipAllowList: []
            maxmemoryPolicy: noeviction
        # No Production database is managed or referenced from U2EB.
