apiVersion: 1

policies:
  - orgId: 1
    receiver: PagerDuty-Platform-OnCall
    grouping:
      - alertname
      - service
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    matchers:
      - name: severity
        value: critical
        operator: =
      - name: pagerduty
        value: enabled
        operator: =
