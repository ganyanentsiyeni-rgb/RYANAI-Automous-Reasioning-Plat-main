apiVersion: 1

groups:
  - orgId: 1
    name: ryanai-endpoint-availability
    folder: Production Observability
    interval: 30s
    rules:
      - uid: ryanai_blackbox_probe_failure
        title: RyanAI endpoint availability failure
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: ${GRAFANA_PROMETHEUS_DATASOURCE_UID}
            model:
              editorMode: code
              expr: 'probe_success{job=~"ryanai-api-health|ryanai-api-awareness|ryanai-web"} == 0'
              instant: true
              range: false
              refId: A
        noDataState: NoData
        execErrState: Alerting
        for: 1m
        annotations:
          summary: "RyanAI endpoint probe failed: {{ $labels.instance }}"
          description: "The endpoint {{ $labels.instance }} has failed its HTTP 200 probe for at least one minute. Inspect probe_success and probe_duration_seconds before taking action."
        labels:
          severity: critical
          environment: production
          service: ryanai
