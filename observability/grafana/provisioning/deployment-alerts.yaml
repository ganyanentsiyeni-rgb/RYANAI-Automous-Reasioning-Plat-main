apiVersion: 1

groups:
  - orgId: 1
    name: deployment-governance-alerts
    folder: Production Observability
    interval: 1m
    rules:
      - uid: ryanai_deployment_failure
        title: Production Deployment Failure Detected
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki-grafana-cloud
            model:
              editorMode: code
              expr: 'sum(count_over_time({service="ryanai-production", event_type="deployment"} | json | status="FAILURE" [5m])) > 0'
              queryType: range
              refId: A
        noDataState: OK
        execErrState: Alerting
        for: 0m
        annotations:
          summary: "RyanAI production deployment failed"
          description: "A structured deployment FAILURE event was detected. Review the GitHub run and PagerDuty incident."
        labels:
          severity: critical
          service: ryanai-production
          pagerduty: enabled
