apiVersion: 1

contactPoints:
  - orgId: 1
    name: PagerDuty-Platform-OnCall
    receivers:
      - uid: pd_platform_receiver
        type: pagerduty
        settings:
          integrationKey: "${PAGERDUTY_INTEGRATION_KEY}"
          severity: critical
          summary: "{{ .CommonAnnotations.summary }}"
          class: "deploy-pipeline"
          client: "RyanAI Grafana"
          client_url: "{{ .ExternalURL }}"
